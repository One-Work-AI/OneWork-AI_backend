name: CI

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint-and-test:
    name: lint & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Run Ruff
        run: uv run ruff check .

      # 테스트용 임시 PostgreSQL(pgserver)을 띄워서 실행 — 팀 DB에 접속하지 않음
      - name: Run tests
        run: uv run pytest -q
