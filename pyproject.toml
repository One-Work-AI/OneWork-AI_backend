[project]
name = "onework-ai-backend"
version = "0.1.0"
description = "DAITDA CS chatbot backend (FastAPI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyjwt>=2.9",
    "httpx>=0.27",
    "python-multipart>=0.0.9",  # 정책 PDF 업로드
    "pypdf>=4.0",               # 정책 PDF에서 글자 뽑기
    "psycopg[binary]>=3.2",     # 팀 PostgreSQL 연결
]

[dependency-groups]
dev = [
    "pgserver>=0.1.4",          # 테스트용 임시 PostgreSQL (설치 없이 실행)
    "pytest>=8.0",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

# 팀 CI(저장소 루트에서 `ruff check .`)는 이 폴더의 파일에 이 설정을 적용합니다.
[tool.ruff]
line-length = 120

[tool.ruff.lint]
# B008: FastAPI는 `Depends(...)`, `Query(...)`를 기본값 자리에 쓰는 게 정해진 사용법이라 제외
extend-ignore = ["B008"]
